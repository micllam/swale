[workspace]
members = ["swale"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/micllam/swale"

[workspace.dependencies]
taquba = "0.13"
taquba-workflow = "0.12"
taquba-cron = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
url = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "process", "io-util", "signal"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
ulid = "1"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
