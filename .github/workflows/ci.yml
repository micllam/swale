name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Supersede an in-flight run when a newer commit arrives on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Separate from `test` so lint and test failures are reported in the same run.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-hack
      # The library builds for a consumer that disables the `cli` feature,
      # and each feature builds on its own.
      - run: cargo hack check -p swale --each-feature --locked

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
      - run: cargo test --workspace --locked

  # The commands against an S3 API: the `aws` feature at run time, the store
  # prefix and two processes on one bucket.
  minio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      minio:
        # The official minio image requires a `server /data` command, which
        # service containers cannot supply. The Bitnami build starts from
        # environment variables and pre-creates the bucket. bitnamilegacy is
        # frozen, so the digest is pinned.
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: swale
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: minio
      - name: s3 tests against MinIO
        env:
          SWALE_TEST_STORE_URL: s3://swale/ci-${{ github.run_id }}
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_ALLOW_HTTP: "true"
        run: cargo test -p swale --features aws --test s3 --locked -- --ignored
