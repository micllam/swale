[graph]
name = "orders_daily"
schedule = "0 2 * * *"
catchup = "7d"
partition = "daily"

[[node]]
name = "extract"
produces = "orders_raw"
operator = "shell"
pool = "default"
retries = 3
[node.params]
command = "dbt run --select orders_raw --vars 'partition: {{ partition }}' >&2 && printf '{\"table\": \"orders_raw\"}'"

[[node]]
name = "transform"
produces = "orders_clean"
consumes = ["orders_raw"]
operator = "shell"
[node.params]
command = "dbt run --select orders_clean --vars 'partition: {{ partition }}' >&2 && printf '{\"rows_key\": \"orders_clean/{{ partition }}\"}'"

[[node]]
name = "load"
produces = "orders_warehouse"
consumes = ["orders_clean"]
operator = "http"
pool = "warehouse"
retries = 5
[node.params]
method = "POST"
url = "https://warehouse.example/load"
headers = { "Content-Type" = "application/json", "Authorization" = "Bearer {{ env.WAREHOUSE_TOKEN }}" }
body = '{"partition": "{{ partition }}", "rows_key": "{{ upstream.transform.rows_key }}"}'
timeout = "10m"

[[node]]
name = "partition_ready"
produces = "orders_source_partition"
operator = "shell"
[node.params]
command = "aws s3api head-object --bucket landing --key orders/{{ partition }}.parquet >&2"

[[node]]
name = "notify"
after = ["load"]
trigger_rule = "all_done"
operator = "http"
[node.params]
method = "POST"
url = "https://chat.example/hook"
headers = { "Content-Type" = "application/json" }
body = "{{ run.summary }}"
