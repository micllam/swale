[package]
name = "swale"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A scheduled asset-graph orchestrator on object storage."
homepage = "https://github.com/micllam/swale"
readme = "README.md"
keywords = ["orchestrator", "scheduler", "pipeline", "dag", "taquba"]
categories = ["command-line-utilities"]
exclude = ["AGENTS.md", "CLAUDE.md"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:url"]
# One object store backend per deployment. Without a backend feature the
# in-memory and local directory stores work.
aws = ["taquba/aws"]
gcp = ["taquba/gcp"]
azure = ["taquba/azure"]

[[bin]]
name = "swale"
required-features = ["cli"]

[dependencies]
taquba = { workspace = true }
taquba-workflow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
croner = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, optional = true }
url = { workspace = true, optional = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
